# ci.yml — Thin-Caller auf das ADR-226-Reusable (platform ADR-266 Stufe 2b).
# Semantik (Lint, Secret-Scan, Test+Coverage, Build+Artefakt-Scan, pip-audit)
# lebt zentral in platform/.github/workflows/_ci-pypi.yml — Verbesserungen
# erreichen alle Pakete in O(1). Inputs abgeleitet aus der Vorgänger-ci.yml.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: iilgmbh/shared-ci/.github/workflows/_ci-pypi.yml@v1.1.0
    with:
      python_versions: '["3.10","3.11","3.12"]'
      install_extra: 'dev'
      test_path: 'tests/'

  # Selbst-Anwendung der eigenen Klickdummy-Invarianten (ADR-002).
  # iil-klickdummy liefert I1-I4 + Parity-Drift an ~13 Repos aus, fuhr sie aber
  # bis 2026-07-29 nicht gegen den eigenen Klickdummy (klickdummy/browser/).
  klickdummy-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -e ".[dev]"
      - name: I1 + I3 + Parity-Suiten-Drift
        run: make klickdummy-gates
