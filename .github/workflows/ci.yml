name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # ruff: damit die generierten-Output-ruff-Tests (test_generated_suite_is_ruff_format_clean,
      # _passes_ruff_check_e402) in CI LAUFEN statt zu skippen (Adopter-Schutz, Retro-F3).
      # Repo-weiter Source-ruff-Gate (ruff check/format src/ tests/) ist separater Follow-up.
      - run: pip install pytest pyyaml jsonschema ruff
      - run: PYTHONPATH=src python -m pytest tests/ -v
