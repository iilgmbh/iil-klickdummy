name: Stale Issues + PRs

on:
  schedule:
    - cron: '0 4 * * *'   # täglich 04:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@eb5cf3af3ac0a1aa4c9c45633dd1ae542a27a899 # v10
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-message: |
            Dieses Issue ist seit 60 Tagen ohne Aktivität. Wenn weiterhin
            relevant, bitte mit Kommentar/Label `keep` markieren — sonst
            wird es in 14 Tagen automatisch geschlossen.
          close-issue-message: |
            Automatisch geschlossen wegen Inaktivität (60 + 14 Tage).
            Re-Open mit neuem Kontext jederzeit möglich.
          stale-issue-label: stale
          exempt-issue-labels: 'keep,tracking,roadmap,P1-high,security'

          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-message: |
            PR ist seit 30 Tagen ohne Aktivität. Bitte rebase oder
            schließen wenn nicht mehr aktuell.
          close-pr-message: |
            Automatisch geschlossen — bitte mit aktuellem main rebase neu öffnen.
          exempt-pr-labels: 'keep,WIP'
