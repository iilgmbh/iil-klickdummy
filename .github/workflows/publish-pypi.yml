name: Publish iil-klickdummy to PyPI

# Triggert auf Git-Tags v*.*.*. Trusted Publishing (OIDC), kein API-Token-Secret.
# Setup einmalig: pypi.org/manage/account/publishing/ → GitHub-Trust-Publisher
#   Owner: iilgmbh
#   Repository: iil-klickdummy
#   Workflow filename: publish-pypi.yml
#   Environment name: pypi

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(grep '^version = ' pyproject.toml | head -1 | sed -E 's/^version = "([^"]+)".*/\1/')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "pyproject.toml: $PKG_VERSION"
          echo "git tag:        $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Version-Mismatch"; exit 1
          fi
      - name: Install build tools
        run: pip install --upgrade build
      - name: Build wheel + sdist
        run: python -m build
      - name: Smoke tests
        run: |
          pip install pytest pyyaml jsonschema
          PYTHONPATH=src python -m pytest tests/ -q
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI (Trusted Publishing / OIDC)
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v3
        with:
          name: "iil-klickdummy ${{ github.ref_name }}"
          body: |
            **iil-klickdummy** Release `${{ github.ref_name }}`.

            Install:
            ```
            pip install "iil-klickdummy>=${{ github.ref_name }}"
            ```

            Konvention: `platform:ADR-211` (Cross-Repo-Rahmen)
            Implementations-ADR: `iilgmbh:iil-klickdummy:ADR-001`
          files: dist/*
          draft: false
          prerelease: false
