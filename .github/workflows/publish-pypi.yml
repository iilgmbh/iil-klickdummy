name: Publish iil-klickdummy to PyPI

# Triggert auf Git-Tags v*.*.*. Trusted Publishing (OIDC), kein API-Token-Secret.
# Setup einmalig: pypi.org/manage/account/publishing/ → GitHub-Trust-Publisher
#   Owner: iilgmbh
#   Repository: iil-klickdummy
#   Workflow filename: publish-pypi.yml
#   Environment name: pypi

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(grep '^version = ' pyproject.toml | head -1 | sed -E 's/^version = "([^"]+)".*/\1/')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "pyproject.toml: $PKG_VERSION"
          echo "git tag:        $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Version-Mismatch"; exit 1
          fi
      - name: Install build tools
        run: pip install --upgrade build
      - name: Build wheel + sdist
        run: python -m build
      - name: Smoke tests (gegen gebautes Wheel, nicht src/)
        run: |
          # PYTHONPATH=src testete bisher nur den Quellbaum — ein package-data-
          # Fehler (schemas/, snippets/; pyproject.toml [tool.setuptools.package-data])
          # wäre erst beim Adopter aufgefallen (T-04, Issue #108). Echtes Wheel
          # installieren + Package-Data-Zugriff verifizieren, dann Tests dagegen laufen.
          pip install dist/*.whl
          pip install pytest pytest-cov
          python -c "
          import iil_klickdummy
          from importlib.resources import files
          schema = files('iil_klickdummy.schemas').joinpath('screens-spec.schema.json')
          assert schema.is_file(), 'package-data missing from wheel: screens-spec.schema.json'
          print('OK: wheel package-data present:', schema)
          "
          python -m pytest tests/ -q
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI (Trusted Publishing / OIDC)
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/

  github-release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: "iil-klickdummy ${{ github.ref_name }}"
          body: |
            **iil-klickdummy** Release `${{ github.ref_name }}`.

            Install:
            ```
            pip install "iil-klickdummy>=${{ github.ref_name }}"
            ```

            Konvention: `platform:ADR-211` (Cross-Repo-Rahmen)
            Implementations-ADR: `iilgmbh:iil-klickdummy:ADR-001`
          files: dist/*
          draft: false
          prerelease: false
