[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iil-klickdummy"
version = "1.34.0"
description = "Shared infrastructure for platform:ADR-211 Klickdummy conformance — invariants, requirements bridge, co-creation widget, multi-klickdummy browser"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "iil GmbH", email = "achim.dehnert@iil.gmbh" }]
maintainers = [{ name = "Achim Dehnert", email = "achim.dehnert@iil.gmbh" }]
keywords = ["klickdummy", "adr-211", "spec-driven-ui", "mockup", "requirements"]
dependencies = ["pyyaml>=6.0", "jsonschema>=4.0", "markdown>=3.4"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "build>=1.0"]

[project.urls]
"Homepage"      = "https://github.com/iilgmbh/iil-klickdummy"
"Repository"    = "https://github.com/iilgmbh/iil-klickdummy"
"Bug Tracker"   = "https://github.com/iilgmbh/iil-klickdummy/issues"
"Documentation" = "https://github.com/iilgmbh/iil-klickdummy#readme"
"ADR-211"       = "https://github.com/achimdehnert/platform/blob/main/docs/adr/ADR-211-klickdummy-benutzeranforderungen-entwicklungsprozess.md"

[project.scripts]
klickdummy-i1 = "iil_klickdummy.check_i1:main_cli"
klickdummy-i2 = "iil_klickdummy.check_i2:main_cli"
klickdummy-i3 = "iil_klickdummy.check_i3:main_cli"
klickdummy-i4 = "iil_klickdummy.check_i4:main_cli"
klickdummy-extract-requirements = "iil_klickdummy.extract_requirements:main_cli"
klickdummy-gen-e2e = "iil_klickdummy.gen_e2e:main_cli"
klickdummy-parity-gate = "iil_klickdummy.parity_gate:main_cli"
klickdummy-infer-asserts = "iil_klickdummy.infer_asserts:main_cli"
klickdummy-mermaid-readback = "iil_klickdummy.mermaid_readback:main_cli"
klickdummy-inventory = "iil_klickdummy.inventory:main_cli"
klickdummy-install-snippets = "iil_klickdummy.install_snippets:main_cli"
klickdummy-browser = "iil_klickdummy.registry:main_cli"
klickdummy-stories = "iil_klickdummy.check_stories:main_cli"
klickdummy-flow = "iil_klickdummy.check_flow:main_cli"
klickdummy-stories-manifest = "iil_klickdummy.gen_stories_manifest:main_cli"
klickdummy-gen-sitemap = "iil_klickdummy.gen_sitemap:main_cli"
klickdummy-sync = "iil_klickdummy.sync_to_orchestrator:main_cli"
klickdummy-manage = "iil_klickdummy.manage:main_cli"
klickdummy-genesor = "iil_klickdummy.lineage:main_cli"
klickdummy-from-django = "iil_klickdummy.from_django:main_cli"
klickdummy-detect = "iil_klickdummy.detect:main_cli"

[tool.setuptools.package-data]
iil_klickdummy = [
    "schemas/*.json",
    # Top-Level-Dateien direkt unter snippets/ (z.B. gates.mk, Issue #162) —
    # eigener Glob noetig, "snippets/<subdir>/*" unten matcht nur Unterordner
    # (setuptools-Globs sind nicht rekursiv). Per Canary in ausschreibungs-hub
    # verifiziert 2026-07-13: eine editable-install (`pip install -e .`, wie in
    # allen lokalen Tests dieses Repos) liest direkt vom Source-Tree und
    # uebersieht ein fehlendes package-data-Pattern — erst ein echter
    # `git+https`-Install (baut ein Wheel) deckte auf, dass gates.mk fehlte.
    "snippets/*",
    "snippets/feedback-widget/*",
    "snippets/issue-template/*",
    "snippets/spec-templates/*",
    "snippets/shell-bootstrap/*",
    "snippets/browser/*",
    "snippets/genesor-sync/*",
]

[tool.ruff]
# py310, nicht py312: requires-python >= 3.10, CI matrixt 3.10/3.11/3.12 —
# ruff darf keine 3.11+/3.12-only-Syntax vorschlagen (Memory lineage-py-312-only-parse).
target-version = "py310"
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
