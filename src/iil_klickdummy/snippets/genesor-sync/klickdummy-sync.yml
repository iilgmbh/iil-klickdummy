# Klickdummy → GitHub Issue + Project Sync
#
# Counter-A-Implementation (Genesor-Adversarial-Review 2026-05-24):
# GitHub-Projects als System-of-Record für Pipeline/Lifecycle/Auth;
# Genesor bleibt Spec-Visualisierungs-Tool.
#
# Heimat (Rev 13 §Distribution):
#   iil-klickdummy/src/iil_klickdummy/snippets/genesor-sync/
#
# Adoption pro Repo:
#   1. Diese Datei nach .github/workflows/klickdummy-sync.yml kopieren
#   2. klickdummy_sync.py nach .github/scripts/klickdummy_sync.py kopieren
#   3. (Optional) repo variable GENESOR_PROJECT_URL setzen
#   4. (Optional) repo secret GENESOR_PROJECT_TOKEN setzen — Org-PAT mit
#      'project'-Scope, sonst funktioniert nur Issue-Sync (kein Project-Add)

name: Klickdummy Sync (Genesor)

on:
  push:
    branches: [main]
    paths:
      - "klickdummy/**/screens-spec.yaml"
      - "docs/01-architektur/mockups/*-klickdummy/screens-spec.yaml"
      - ".github/workflows/klickdummy-sync.yml"
      - ".github/scripts/klickdummy_sync.py"
  workflow_dispatch:
    inputs:
      only:
        description: "Nur diesen KD-Namen syncen (leer = alle)"
        required: false
        type: string
      dry_run:
        description: "Dry-run (nichts schreiben)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      # Bevorzugt Org-PAT mit project-Scope (für Project-Add). Fallback auf
      # GITHUB_TOKEN — der kann Issues, aber NICHT Projects-V2-Membership.
      GH_TOKEN: ${{ secrets.GENESOR_PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PROJECT_URL: ${{ vars.GENESOR_PROJECT_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Sync Klickdummies
        run: |
          ARGS=""
          if [ -n "${{ inputs.only }}" ]; then
            ARGS="$ARGS --only ${{ inputs.only }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python3 .github/scripts/klickdummy_sync.py $ARGS
          # Hinweis bei fehlendem Project-Token: Project-Add ist optional —
          # wenn GENESOR_PROJECT_URL gesetzt aber kein GENESOR_PROJECT_TOKEN-
          # Secret existiert, läuft der Sync trotzdem (Issues werden angelegt,
          # aber dem Project nicht hinzugefügt). Setup-Hinweise im snippet-
          # README (iil-klickdummy/snippets/genesor-sync/).
