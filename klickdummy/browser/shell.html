<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klickdummy-Browser — Redesign (Mock)</title>
<!--
  MOCK (class: mock) — Klickdummy zu iil-klickdummy:ADR-002, Spec klickdummy/browser/screens-spec.yaml.
  Zweck: abnahmefähiger Prototyp des klickdummy-browser-Redesigns VOR der Reimplementierung
  von registry.py/browser.html.tmpl. Demonstriert:
    N1 (S-01): Daten kommen aus <script type="application/json">, DOM via textContent + <template>
               — KEIN innerHTML-String-Concat, kein </script>-Ausbruch.
    N2 (ADR-048/049): --pui-*-Tokens statt Hex; addEventListener statt onclick; keine inline style=.
    N3 (ADR-040): data-testid an jedem interaktiven Element (Parity-Anker der Spec).
-->
<style>
  :root {
    /* Zwei-Layer-Token-System (ADR-049) — lokale --pui-*-Bridge, keine shared UI-Lib (ADR-200 paused) */
    --pui-primary:   #1a3a6c;
    --pui-surface:   #f8fafc;
    --pui-surface-2: #ffffff;
    --pui-border:    #d8e0e8;
    --pui-muted:     #6a7888;
    --pui-success:   #22c55e;
    --pui-space-1: 4px;
    --pui-space-2: 8px;
    --pui-space-3: 12px;
    --pui-space-4: 16px;
    --pui-radius:   6px;
    --pui-radius-lg: 8px;
    /* Badge-Klassenfarben als Tokens (statt Inline-Hex je Badge) */
    --pui-badge-mock-bg: #e0f2fe;      --pui-badge-mock-fg: #075985;
    --pui-badge-stub-bg: #fef3c7;      --pui-badge-stub-fg: #92400e;
    --pui-badge-story-bg: #f3e8ff;     --pui-badge-story-fg: #6b21a8;
    --pui-badge-specdemo-bg: #dcfce7;  --pui-badge-specdemo-fg: #166534;
  }
  *, *::before, *::after { box-sizing: border-box; }
  /* [hidden] robust durchsetzen — sonst überschreibt display:flex/block das Attribut
     (UA-Regel [hidden]{display:none} hat zu geringe Spezifität). */
  [hidden] { display: none !important; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; height: 100vh; display: flex; color: var(--pui-primary); }
  aside { width: 320px; padding: var(--pui-space-4); border-right: 1px solid var(--pui-border); background: var(--pui-surface); overflow-y: auto; }
  aside h1 { font-size: 16px; margin: 0 0 var(--pui-space-3); }
  .meta { font-size: 11px; color: var(--pui-muted); }
  label { display: block; font-size: 11px; color: var(--pui-muted); margin-top: var(--pui-space-3); margin-bottom: var(--pui-space-1); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  select { width: 100%; font-family: inherit; font-size: 13px; padding: var(--pui-space-1) var(--pui-space-2); border: 1px solid var(--pui-border); border-radius: var(--pui-radius); background: var(--pui-surface-2); }
  select:disabled { opacity: .5; }
  .detail { margin-top: var(--pui-space-4); padding: var(--pui-space-3); background: var(--pui-surface-2); border: 1px solid var(--pui-border); border-radius: var(--pui-radius-lg); font-size: 12px; }
  .detail dt { font-weight: 600; color: var(--pui-primary); margin-top: var(--pui-space-2); }
  .detail dt:first-child { margin-top: 0; }
  .detail dd { margin: 2px 0 0; }
  code { background: var(--pui-surface); padding: 1px 4px; border-radius: 3px; font-size: 11px; }
  .badge { display: inline-block; padding: 2px 7px; border-radius: 10px; font-size: 10px; font-weight: 600; }
  .badge.mock { background: var(--pui-badge-mock-bg); color: var(--pui-badge-mock-fg); }
  .badge.stub-demo { background: var(--pui-badge-stub-bg); color: var(--pui-badge-stub-fg); }
  .badge.story { background: var(--pui-badge-story-bg); color: var(--pui-badge-story-fg); }
  .badge.spec-demo { background: var(--pui-badge-specdemo-bg); color: var(--pui-badge-specdemo-fg); }
  .mode-toggle { display: flex; gap: var(--pui-space-1); margin-top: var(--pui-space-3); }
  .mode-toggle button { flex: 1; padding: var(--pui-space-1) var(--pui-space-2); font-size: 12px; border: 1px solid var(--pui-border); border-radius: var(--pui-radius); background: var(--pui-surface-2); color: var(--pui-muted); cursor: pointer; font-family: inherit; }
  .mode-toggle button[aria-pressed="true"] { background: var(--pui-primary); color: var(--pui-surface-2); border-color: var(--pui-primary); font-weight: 600; }
  .panel[hidden] { display: none; }
  .story-progress { font-size: 11px; color: var(--pui-muted); margin: var(--pui-space-2) 0 var(--pui-space-1); }
  .story-stepper { list-style: none; margin: 0 0 var(--pui-space-3); padding: 0; }
  .story-stepper li { display: flex; align-items: flex-start; gap: var(--pui-space-2); padding: var(--pui-space-1) var(--pui-space-2); border-radius: var(--pui-radius); font-size: 12px; cursor: pointer; border: 1px solid transparent; }
  .story-stepper li[data-active="true"] { background: #e8eef8; border-color: #c5d5ec; font-weight: 600; }
  .story-stepper li[data-visited="true"] .step-icon { color: var(--pui-success); }
  .story-nav { display: flex; gap: var(--pui-space-2); }
  .story-nav button { flex: 1; padding: var(--pui-space-1) var(--pui-space-2); font-size: 12px; border: 1px solid var(--pui-border); border-radius: var(--pui-radius); background: var(--pui-surface-2); color: var(--pui-primary); cursor: pointer; font-family: inherit; font-weight: 600; }
  .story-nav button:disabled { opacity: .35; cursor: default; }
  main { flex: 1; display: flex; flex-direction: column; }
  .empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--pui-muted); font-size: 14px; padding: var(--pui-space-4); text-align: center; }
  .error { color: var(--pui-badge-stub-fg); background: var(--pui-badge-stub-bg); }
  iframe { flex: 1; width: 100%; border: 0; }
  footer { padding: var(--pui-space-1) var(--pui-space-4); font-size: 10px; color: var(--pui-muted); border-top: 1px solid var(--pui-border); background: var(--pui-surface); }
</style>
</head>
<body>
<aside>
  <h1>🗂 Klickdummies</h1>
  <div class="meta">Repo: <code data-testid="repo-label">iil-klickdummy</code> · <span data-testid="mock-marker">Mock · ADR-002</span></div>

  <div class="mode-toggle" data-testid="mode-toggle" hidden>
    <button data-testid="btn-free" data-mode="free" aria-pressed="true">🗂 Frei</button>
    <button data-testid="btn-story" data-mode="story" aria-pressed="false">📖 Story-Walk</button>
  </div>

  <section class="panel" data-testid="free-panel" data-panel="free">
    <label for="kd-select">Klickdummy</label>
    <select id="kd-select" data-testid="kd-select"></select>

    <label for="ver-select">Spec-Version</label>
    <select id="ver-select" data-testid="ver-select" disabled>
      <option value="current">aktuell (HEAD)</option>
    </select>

    <dl class="detail" data-testid="kd-detail"><dd><em>Klickdummy auswählen…</em></dd></dl>
    <div class="detail error" data-testid="version-no-snapshot" hidden></div>
    <div class="meta" data-testid="version-readonly" hidden>Historische Version — read-only (kein Feedback).</div>
  </section>

  <section class="panel" data-testid="story-panel" data-panel="story" hidden>
    <label for="story-select">Story</label>
    <select id="story-select" data-testid="story-select"></select>
    <div class="story-progress" data-testid="story-progress"></div>
    <ul class="story-stepper" data-testid="story-stepper"></ul>
    <div class="story-nav">
      <button data-testid="btn-prev" data-nav="-1" disabled>← Zurück</button>
      <button data-testid="btn-next" data-nav="1" disabled>Weiter →</button>
    </div>
    <div class="detail error" data-testid="step-load-error" hidden></div>
  </section>
</aside>
<main>
  <div class="empty" data-testid="empty">Klickdummy links auswählen, um ihn rechts zu laden.</div>
  <iframe data-testid="kd-frame" title="Aktiver Klickdummy" hidden></iframe>
</main>
<footer>Generiert durch <code>iil-klickdummy</code> · Browser-Redesign-Mock · platform:ADR-211 / iil-klickdummy:ADR-002</footer>

<!-- N1 (löst S-01): Daten als JSON-Insel + JSON.parse.
     WICHTIG: eine JSON-Insel allein reicht NICHT — der HTML-Parser beendet JEDES
     <script>-Element (auch type="application/json") an einem literalen </script>.
     Daher MUSS beim Serialisieren jedes "</" zu "<\/" escaped werden (JSON liest
     "\/" als "/", der Parser sieht kein Ende-Tag). Im echten registry.py:
     json.dumps(data, ensure_ascii=False).replace("</", "<\\/"). Hier ist der
     XSS-Probe-Titel bewusst so escaped — er MUSS als Text ankommen, nie ausführen. -->
<script type="application/json" data-testid="kd-data">
{
  "klickdummies": [
    { "title": "Login-Flow", "spec_id": "example:klickdummy-spec-login", "spec_version": "1.2",
      "class": "mock", "adr_local": "example:ADR-100", "path": "klickdummy/login/screens-spec.yaml",
      "sister_of": [], "versions": [
        { "spec_version": "1.1", "commit_date": "2026-06-01", "commit_sha": "a1b2c3d", "shell_path": "" }
      ] },
    { "title": "SDS-Review-Queue", "spec_id": "risk-hub:klickdummy-spec-sds", "spec_version": "0.4",
      "class": "spec-demo", "adr_local": "risk-hub:ADR-046", "path": "klickdummy/sds/screens-spec.yaml",
      "sister_of": ["meiki-hub:ADR-021"], "versions": [] },
    { "title": "x<\/script><script>window.__XSS__=1<\/script>", "spec_id": "demo:klickdummy-spec-xss",
      "spec_version": "0.1", "class": "mock", "adr_local": "", "path": "klickdummy/xss-probe/screens-spec.yaml",
      "sister_of": [], "versions": [] }
  ],
  "stories": [
    { "id": "onboarding", "title": "Onboarding-Journey", "steps": [
      { "label": "Login", "kd_index": 0 },
      { "label": "SDS-Review öffnen", "kd_index": 1 },
      { "label": "Fehlender Schritt (Demo N4)", "kd_index": 99 }
    ] }
  ]
}
</script>

<template data-testid="tpl-detail-row"><dt></dt><dd></dd></template>
<template data-testid="tpl-step"><li><span class="step-icon"></span><span class="step-label"></span></li></template>

<script>
'use strict';
(function () {
  // N1: parse statt eval/Concat.
  var data = JSON.parse(document.querySelector('[data-testid="kd-data"]').textContent);
  var KDS = data.klickdummies, STORIES = data.stories;

  var $ = function (t) { return document.querySelector('[data-testid="' + t + '"]'); };
  function show(el, on) { el.hidden = !on; }
  function setText(el, s) { el.textContent = s == null ? '' : String(s); } // N1: nie innerHTML

  // ── Detail (N1: textContent + geklonte <template>-Rows, kein innerHTML-Concat) ──
  function renderDetail(k, ver) {
    var dl = $('kd-detail'); dl.textContent = '';
    var tpl = $('tpl-detail-row');
    function row(label, valueFn) {
      var frag = tpl.content.cloneNode(true);
      setText(frag.querySelector('dt'), label);
      valueFn(frag.querySelector('dd'));
      dl.appendChild(frag);
    }
    row('Spec', function (dd) { var c = document.createElement('code'); setText(c, k.spec_id); dd.appendChild(c); dd.append(' v' + k.spec_version); });
    if (ver) row('Angezeigte Version', function (dd) { setText(dd, 'v' + ver.spec_version + ' · ' + ver.commit_date + ' · ' + ver.commit_sha + ' (historisch, read-only)'); });
    row('Klasse', function (dd) { var b = document.createElement('span'); b.className = 'badge ' + k.class; b.setAttribute('data-testid', 'kd-class-badge'); setText(b, k.class); dd.appendChild(b); });
    row('ADR', function (dd) { if (k.adr_local) { var c = document.createElement('code'); setText(c, k.adr_local); dd.appendChild(c); } else { var e = document.createElement('em'); setText(e, 'kein ADR-Ref'); dd.appendChild(e); } });
    row('Spec-Pfad', function (dd) { var c = document.createElement('code'); setText(c, k.path); dd.appendChild(c); });
    show($('version-readonly'), !!ver);
  }

  function populateVersions(k) {
    var vsel = $('ver-select'), vs = k.versions || [];
    vsel.textContent = '';
    var head = new Option('aktuell (HEAD, v' + k.spec_version + ')', 'current'); vsel.add(head);
    vs.forEach(function (v, i) { vsel.add(new Option('v' + v.spec_version + ' · ' + v.commit_date + (v.shell_path ? '' : ' (kein Shell-Snapshot)'), String(i))); });
    vsel.value = 'current'; vsel.disabled = vs.length === 0;
  }

  function loadFrame(srcOrNull, emptyMsg) {
    var fr = $('kd-frame'), empty = $('empty');
    if (srcOrNull) { fr.removeAttribute('srcdoc'); fr.src = srcOrNull; show(fr, true); show(empty, false); }
    else { setText(empty, emptyMsg || ''); show(fr, false); show(empty, true); }
  }

  // N1-sicher: Titel/Felder werden HTML-escaped, bevor sie in den srcdoc-String gehen.
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  // Mock-Vorschau: repräsentativer Fake-Screen je Klickdummy, damit die rechte
  // Fläche zeigt WIE der Browser mit Inhalt aussieht (statt leerem Platzhalter).
  function mockPreview(k, ver) {
    var tag = ver ? ('v' + esc(ver.spec_version) + ' · ' + esc(ver.commit_date) + ' · read-only') : ('v' + esc(k.spec_version) + ' · aktuell');
    // EHRLICHER Vorschau-Slot: der Browser hat KEINEN eigenen Inhalt — hier lädt im
    // echten Betrieb die Shell des ausgewählten Klickdummy. Kein Fake-Inhalt, der eine
    // Aussage vortäuscht; stattdessen klar benannter Render-Bereich.
    return '<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><style>'
      + 'html,body{height:100%}body{font-family:system-ui,sans-serif;margin:0;color:#1a3a6c;'
      + 'background:repeating-linear-gradient(45deg,#f4f7fb,#f4f7fb 12px,#eef2f7 12px,#eef2f7 24px);'
      + 'display:flex;align-items:center;justify-content:center}'
      + '.slot{background:#fff;border:2px dashed #c5d5ec;border-radius:12px;padding:28px 32px;max-width:560px;text-align:center}'
      + '.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#6a7888;font-weight:600}'
      + '.t{font-size:20px;font-weight:700;margin:8px 0 4px}.b{display:inline-block;font-size:11px;background:#e0f2fe;color:#075985;padding:3px 10px;border-radius:10px}'
      + '.mut{color:#6a7888;font-size:13px;line-height:1.5;margin-top:14px}code{background:#f3f4f6;padding:1px 5px;border-radius:3px;font-size:12px}</style></head><body>'
      + '<div class="slot">'
      + '<div class="eyebrow">Render-Bereich · iframe</div>'
      + '<div class="t">' + esc(k.title) + '</div>'
      + '<span class="b">' + esc(k.class) + ' · ' + tag + '</span>'
      + '<p class="mut">Hier rendert im echten Browser die <strong>Shell dieses Klickdummy</strong> aus '
      + '<code>' + esc(k.path) + '</code>.<br>Der Browser selbst hat keinen eigenen Inhalt — er ist der '
      + '<strong>Navigationsrahmen</strong> um beliebige Klickdummies (Auswahl · Story-Walk · Versionen), '
      + 'der links bedient wird. Dieser Mock nimmt genau diesen Rahmen ab.</p>'
      + '</div></body></html>';
  }
  function showPreview(k, ver) {
    var fr = $('kd-frame'), empty = $('empty');
    fr.removeAttribute('src'); fr.srcdoc = mockPreview(k, ver);
    show(fr, true); show(empty, false);
  }

  var currentKD = null;
  $('kd-select').addEventListener('change', function (e) {
    show($('version-no-snapshot'), false);
    var k = KDS[parseInt(e.target.value, 10)];
    if (!k) return;
    currentKD = k; renderDetail(k); populateVersions(k);
    showPreview(k);   // repräsentative Mock-Vorschau im iframe
  });

  $('ver-select').addEventListener('change', function (e) {
    if (!currentKD) return;
    if (e.target.value === 'current') { renderDetail(currentKD); show($('version-no-snapshot'), false); return; }
    var v = (currentKD.versions || [])[parseInt(e.target.value, 10)];
    if (!v) return;
    renderDetail(currentKD, v);
    if (v.shell_path) { show($('version-no-snapshot'), false); showPreview(currentKD, v); }
    else { var n = $('version-no-snapshot'); setText(n, 'Kein shell.html-Snapshot für v' + v.spec_version + ' (nur Spec versioniert).'); show(n, true); loadFrame(null, ''); }
  });

  // ── Story-Walk ──
  var storyIdx = 0, stepIdx = 0;
  function vkey(sid, i) { return 'kd-story-visited:' + sid + ':' + i; }
  function visited(sid, i) { try { return !!localStorage.getItem(vkey(sid, i)); } catch (e) { return false; } }
  function markVisited(sid, i) { try { localStorage.setItem(vkey(sid, i), '1'); } catch (e) {} }

  function renderStepper(story, active) {
    setText($('story-progress'), 'Schritt ' + (active + 1) + ' / ' + story.steps.length);
    var ul = $('story-stepper'); ul.textContent = '';
    var tpl = $('tpl-step');
    story.steps.forEach(function (step, i) {
      var frag = tpl.content.cloneNode(true), li = frag.querySelector('li');
      li.dataset.active = String(i === active); li.dataset.visited = String(visited(story.id, i)); li.dataset.step = String(i);
      setText(li.querySelector('.step-icon'), i === active ? '●' : (visited(story.id, i) ? '✅' : '○'));
      setText(li.querySelector('.step-label'), step.label);
      ul.appendChild(frag);
    });
    markVisited(story.id, active);
  }

  function loadStep(si, sti) {
    storyIdx = si; stepIdx = sti;
    var story = STORIES[si]; renderStepper(story, sti);
    var step = story.steps[sti], k = KDS[step.kd_index];
    var err = $('step-load-error');
    if (!k) { setText(err, 'N4: Schritt „' + step.label + '" verweist auf einen fehlenden Klickdummy (kd_index ' + step.kd_index + ') — kein stiller Leerzustand.'); show(err, true); loadFrame(null, ''); }
    else { show(err, false); showPreview(k); }
    $('btn-prev').disabled = sti === 0; $('btn-next').disabled = sti === story.steps.length - 1;
  }

  function initStories() {
    if (!STORIES.length) return;
    show($('mode-toggle'), true);
    var sel = $('story-select');
    STORIES.forEach(function (s, i) { sel.add(new Option(s.title + ' (' + s.steps.length + ' Schritte)', String(i))); });
    sel.addEventListener('change', function (e) { loadStep(parseInt(e.target.value, 10), 0); });
  }

  document.querySelectorAll('[data-nav]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var story = STORIES[storyIdx], next = stepIdx + parseInt(btn.dataset.nav, 10);
      if (next < 0 || next >= story.steps.length) return;
      loadStep(storyIdx, next);
    });
  });

  document.querySelectorAll('[data-mode]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var mode = btn.dataset.mode;
      document.querySelectorAll('[data-mode]').forEach(function (b) { b.setAttribute('aria-pressed', String(b === btn)); });
      show($('free-panel'), mode === 'free'); show($('story-panel'), mode === 'story');
      if (mode === 'story' && STORIES.length && !$('story-stepper').children.length) loadStep(0, 0);
    });
  });

  // Delegierter Klick auf Stepper-Einträge (statt onclick pro <li>)
  $('story-stepper').addEventListener('click', function (e) {
    var li = e.target.closest('[data-step]'); if (li) loadStep(storyIdx, parseInt(li.dataset.step, 10));
  });

  // ── Init ──
  var sel = $('kd-select');
  sel.add(new Option('— wählen —', ''));
  KDS.forEach(function (k, i) { sel.add(new Option(k.title + ' (v' + k.spec_version + ')', String(i))); }); // Option()-Text ist textContent → N1-sicher
  initStories();
})();
</script>
</body>
</html>
