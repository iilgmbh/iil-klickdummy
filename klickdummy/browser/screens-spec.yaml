# Klickdummy — klickdummy-browser (Spec-first-Neuaufbau, /repo-ux-opt B)
# Erdet 1:1 an docs/use-cases/UC-001..004 + NFR-browser.md (PR #100).
#
# STAND ab v0.2 (Abnahme 2026-07-29, ADR-002 accepted): Die statische Mock-Shell
# (klickdummy/browser/shell.html) ist ENTFALLEN — alle Screens sind in den echten
# Renderer migriert (src/iil_klickdummy/snippets/browser/browser.html.tmpl +
# registry.py, PR #101). Diese Spec bleibt die Source-of-Record des UX-Vertrags und
# richtet sich ab jetzt gegen die GENERIERTE Browser-Ausgabe, nicht gegen einen Mock.
# Die vormals offenen ASSUMPTION[unverified]-Punkte sind bei der Abnahme entschieden
# (siehe ADR-002 „Abnahme-Entscheidungen").
$schema: ./screens-spec.schema.json
spec_id: iil-klickdummy:klickdummy-spec-browser
spec_version: "0.2"
spec_schema_version: "1.1"
spec_date: "2026-07-29"
title: Klickdummy-Browser — Redesign

adr:
  local: iil-klickdummy:ADR-002
  conforms_to: platform:ADR-211
  sister_of: []

class: mock
class_evidence:
  no_backend: true
  no_demo_param: true
  target_mocks_visible: true
  systemgrenzen:
    - Klickdummy-Registry (KLICKDUMMIES-JSON, generiert)
    - Story-Manifest (STORIES-JSON, generiert)
    - Klickdummy-Shell-iframe-Quelle

grounding:
  konzept: docs/use-cases/README.md
  konzept_id: iil-klickdummy:UX-B-browser
  pilot: "Echter Renderer src/iil_klickdummy/snippets/browser/browser.html.tmpl (registry.py render)"
  rechtsrahmen_kernnormen: {}

off_ramp:
  policy: platform:ADR-211 Static→Echt-Migrationspfad
  unit: per-screen
  rule: "Parity-grün pro Screen ⇒ Screen aus statischer Mock-Quelle in den echten Renderer (registry.py/browser.html.tmpl) migrieren"
  doppelquell_grenze: prod-release
  parity_runner: klickdummy-gen-e2e
  product_repo_planned: iil-klickdummy (Selbst-Konsument)
  status_overall: "removed — statische Mock-Shell entfallen (2026-07-29), alle Screens im echten Renderer"

personas:
  reviewer:
    label: Reviewer / Fachbereich
    rolle: Sichtet die Klickdummies eines Repos, klickt Journeys durch, schaltet Versionen um
    sieht:
      - Klickdummy-Auswahl und Detail-Metadaten
      - Story-Walk mit Stepper
      - historische Spec-Versionen (read-only)
  agent:
    label: Coding-Agent
    rolle: Nutzt den Browser, um vorhandene Klickdummies eines Repos vor Weiterarbeit zu sichten
    sieht:
      - dieselbe Oberfläche wie Reviewer (kein Sonderzustand)

# HINWEIS zur generierten Parity-Suite (klickdummy/browser/test_parity_browser.py):
# Der Browser ist EINE Seite mit umschaltbaren Panels, keine Route-je-Screen-App.
# `make klickdummy-parity-drift` fährt deshalb bewusst nur Stufe 1 (Suite neu
# generieren → kompilieren → Drift gegen den Commit) — die Suite wird NICHT in CI
# gegen einen laufenden Renderer ausgeführt; dafür fehlt gen_e2e die Interaktion
# (Panel umschalten, Fehlerzustand injizieren). Die Anker unten sind trotzdem
# verbindlich: sie sind der Vertrag, gegen den manuell/per /kd-review geprüft wird.
screens:
  - id: browser-frei
    title: Frei-Modus — Klickdummy auswählen & ansehen
    personas: [reviewer, agent]
    purpose: "Einen Klickdummy aus der Liste wählen; Detail-Metadaten + Render im iframe."
    use_cases: [UC-001-browser-frei-auswahl]
    parity_acceptance:
      - id: browser-frei.select-visible
        check: "Das Klickdummy-Auswahl-Dropdown ist sichtbar und bedienbar."
        assert: { action: visible, selector: "testid=kd-select" }
      - id: browser-frei.detail-after-select
        check: "Nach Auswahl erscheint das Detail-Panel mit Spec-ID, Klasse-Badge, ADR, Pfad."
        assert: { action: visible, selector: "testid=kd-detail" }
      - id: browser-frei.class-badge-stable
        check: "Die Klasse wird als stabiler Badge-Anker gezeigt (nicht als fragiler CSS-Pfad)."
        assert: { action: visible, selector: "testid=kd-class-badge" }
      - id: browser-frei.frame-visible
        check: "Der iframe wird nach einer Auswahl sichtbar (Leerzustand verschwindet)."
        assert: { action: visible, selector: "testid=kd-frame" }
      - id: browser-frei.no-injection
        check: "N1/S-01: Ein Klickdummy mit title 'x</script><script>...' wird als Text gezeigt, kein Script läuft. ENTSCHIEDEN (ADR-002 AS-1): Titel-Sortierung bleibt Generierungsreihenfolge."
        assert: { action: visible, selector: "testid=kd-select" }
      - id: browser-frei.frame-error-visible
        check: "N4: Lädt die Shell nicht (404/leere Seite/keine Antwort), erscheint eine sichtbare Fehlermeldung statt eines leeren iframes. Fehlerzustand — nur bei injiziertem Ladefehler sichtbar."
        assert: { action: visible, selector: "testid=frame-load-error" }
    off_ramp_status: removed

  - id: browser-story
    title: Story-Walk — geführte Journey über mehrere Klickdummies
    personas: [reviewer]
    purpose: "Eine Story wählen und Schritt für Schritt über mehrere Klickdummies gehen."
    use_cases: [UC-002-browser-story-walk]
    parity_acceptance:
      - id: browser-story.toggle-when-stories
        check: "Der Modus-Toggle ist sichtbar, wenn Stories vorhanden sind."
        assert: { action: visible, selector: "testid=mode-toggle" }
      - id: browser-story.stepper-count
        check: "Der Stepper listet genau so viele Einträge wie die Story Schritte hat."
        assert: { action: visible, selector: "testid=story-stepper" }
      - id: browser-story.next-enabled
        check: "Auf Schritt 1 einer mehrschrittigen Story ist Weiter bedienbar."
        assert: { action: clickable, selector: "testid=btn-next" }
      - id: browser-story.error-visible
        check: "N4: Ein Schritt mit fehlendem kd_index zeigt eine sichtbare Meldung, keinen leeren iframe. ENTSCHIEDEN (ADR-002 AS-2): Meldung statt Auto-Skip."
        assert: { action: visible, selector: "testid=step-load-error" }
      - id: browser-story.stepper-keyboard
        check: "N6: Jeder Stepper-Eintrag ist per Tastatur erreichbar und auslösbar (role=button, tabindex=0, Enter/Space) — nicht nur per Maus."
        assert: { action: clickable, selector: "testid=story-stepper" }
    off_ramp_status: removed

  - id: browser-versionen
    title: Versions-Historie — historische Spec-Version read-only ansehen
    personas: [reviewer]
    purpose: "Zwischen aktueller und historischen Spec-Versionen eines Klickdummy umschalten."
    use_cases: [UC-003-browser-versionen]
    parity_acceptance:
      - id: browser-versionen.select-present
        check: "Das Versions-Dropdown ist vorhanden (disabled, wenn keine Historie)."
        assert: { action: visible, selector: "testid=ver-select" }
      - id: browser-versionen.readonly-marker
        check: "Eine gewählte historische Version ist als read-only gekennzeichnet."
        assert: { action: visible, selector: "testid=version-readonly" }
      - id: browser-versionen.no-snapshot-hint
        check: "Eine Version ohne Shell-Snapshot zeigt einen Hinweis statt eines iframes. ENTSCHIEDEN (ADR-002 AS-3): read-only-Kennzeichnung nur im Detail-Panel, kein iframe-Banner."
        assert: { action: visible, selector: "testid=version-no-snapshot" }
    off_ramp_status: removed

  - id: browser-cross-repo
    title: Cross-Repo-Modus — Klickdummies mehrerer Repos in einer Liste
    personas: [reviewer, agent]
    purpose: "Aus `klickdummy-browser --cross-repo` erzeugte Sammelliste: nach Repo gruppierte Auswahl; da fremde Shells nicht einbettbar sind, führen GitHub-Links zu Shell und Spec."
    use_cases: [UC-004-browser-cross-repo]
    parity_acceptance:
      - id: browser-cross-repo.optgroup-per-repo
        check: "Die Auswahlliste gruppiert Einträge nach `<org>/<repo>` (optgroup) statt sie flach zu mischen."
        assert: { action: visible, selector: "testid=kd-optgroup" }
      - id: browser-cross-repo.repo-in-detail
        check: "Das Detail-Panel zeigt bei Cross-Repo-Einträgen zusätzlich das Herkunfts-Repo."
        assert: { action: visible, selector: "testid=kd-repo" }
      - id: browser-cross-repo.notice-instead-of-frame
        check: "Statt eines toten iframes (shell_path ist repo-relativ und hier nicht auflösbar) erscheint ein Hinweis-Panel."
        assert: { action: visible, selector: "testid=cross-repo-notice" }
      - id: browser-cross-repo.github-shell-link
        check: "Der Hinweis verlinkt die Shell im Herkunfts-Repo auf GitHub (github_shell_url aus registry.py)."
        assert: { action: visible, selector: "testid=link-github-shell" }
      - id: browser-cross-repo.github-spec-link
        check: "Der Hinweis verlinkt zusätzlich die Spec im Herkunfts-Repo (github_spec_url)."
        assert: { action: visible, selector: "testid=link-github-spec" }
    off_ramp_status: removed
